name: Agentpod bootstrap archives (from source)

# Builds Termux bootstrap archives FROM SOURCE (not prebuilt debs) for the
# custom Android app prefix /data/data/cc.agentlabs.agentpod/files/usr.
# The prefix is baked in at compile time via TERMUX_APP__PACKAGE_NAME in
# scripts/properties.sh, so all ELF RUNPATHs and script shebangs point at the
# agentpod prefix instead of com.termux.

on:
  workflow_dispatch:

permissions: {} # none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64
          - arm
          - i686
          - x86_64
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h /

      - name: Show target prefix
        run: |
          grep -n 'TERMUX_APP__PACKAGE_NAME=' scripts/properties.sh | head -n 2

      - name: Install extra Android SDK components (for termux-am APK)
        run: |
          # termux-am v0.8.0 builds its APK with AGP 7.4.2 against
          # platforms;android-33 + build-tools;30.0.3. The package-builder image's
          # pre-installed SDK is root-owned and the container's restricted AppArmor
          # profile blocks `sudo chown`, so sdkmanager can't write into it ("Failed
          # to read or create install properties file"). Instead, provision a fresh,
          # fully writable SDK under $HOME with its own commandline-tools and install
          # exactly the components termux-am needs. The build step below is pointed at
          # this SDK via ANDROID_HOME/ANDROID_SDK_ROOT env injection. Runs in the same
          # persistent container the build step reuses, so $HOME/android-sdk persists.
          ./scripts/run-docker.sh bash -c '
            set -eux
            export ANDROID_SDK_ROOT="$HOME/android-sdk"
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
            export ANDROID_USER_HOME="$HOME/.android"
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools" "$ANDROID_USER_HOME"
            cd "$ANDROID_SDK_ROOT"
            curl -fsSLo cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdtools.zip -d cmdline-tools
            # sdkmanager expects to live in cmdline-tools/latest/bin
            rm -rf cmdline-tools/latest
            mv cmdline-tools/cmdline-tools cmdline-tools/latest
            SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKMGR" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" --sdk_root="$ANDROID_SDK_ROOT" \
              "platform-tools" "platforms;android-33" "build-tools;30.0.3"
            echo "=== platforms ==="; ls "$ANDROID_SDK_ROOT/platforms"
            echo "=== build-tools ==="; ls "$ANDROID_SDK_ROOT/build-tools"
            # Hard assert so any failure surfaces here, not later inside gradle.
            test -d "$ANDROID_SDK_ROOT/platforms/android-33" \
              || { echo "ERROR: platforms;android-33 not installed" >&2; exit 1; }
            test -d "$ANDROID_SDK_ROOT/build-tools/30.0.3" \
              || { echo "ERROR: build-tools;30.0.3 not installed" >&2; exit 1; }
            echo "Android SDK ready at $ANDROID_SDK_ROOT"
          '

      - name: Build bootstrap archive from source (${{ matrix.arch }})
        env:
          # Point termux-am's gradle build (via its `export ANDROID_HOME`) at the
          # writable SDK provisioned above, overriding the image's root-owned SDK.
          TERMUX_DOCKER_EXEC_EXTRA_ARGS: >-
            --env ANDROID_HOME=/home/builder/android-sdk
            --env ANDROID_SDK_ROOT=/home/builder/android-sdk
        run: |
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh -f --architectures ${{ matrix.arch }}

      - name: Verify prefix baked into artifacts (${{ matrix.arch }})
        run: |
          set -euo pipefail
          zip="bootstrap-${{ matrix.arch }}.zip"
          test -f "$zip"
          rm -rf _verify && mkdir _verify
          unzip -q "$zip" -d _verify
          echo "=== readelf -d bin/bash RUNPATH ==="
          runpath="$(readelf -d _verify/bin/bash | grep -iE 'RUNPATH|RPATH' || true)"
          echo "$runpath"
          if echo "$runpath" | grep -q 'com.termux'; then
            echo "ERROR: RUNPATH still references com.termux" >&2
            exit 1
          fi
          if ! echo "$runpath" | grep -q '/data/data/cc.agentlabs.agentpod/files/usr/lib'; then
            echo "ERROR: RUNPATH does not reference agentpod prefix" >&2
            exit 1
          fi
          echo "=== shebang check (termux-bootstrap second stage) ==="
          sec="$(find _verify -name 'termux-bootstrap-second-stage.sh' | head -n1)"
          if [ -n "$sec" ]; then
            head -n 1 "$sec"
            head -n 1 "$sec" | grep -q '/data/data/cc.agentlabs.agentpod/files/usr' || {
              echo "ERROR: second-stage shebang/prefix wrong" >&2; exit 1; }
          fi
          echo "=== sample ELF interpreter/shebang scan for com.termux ==="
          if grep -rIl 'com.termux' _verify/bin 2>/dev/null | head; then
            echo "WARNING: found com.termux string references in bin scripts (review above)"
          fi
          rm -rf _verify

      - name: Store bootstrap artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.arch }}
          path: bootstrap-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7
