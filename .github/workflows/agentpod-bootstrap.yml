name: Agentpod bootstrap archives (from source)

# Builds Termux bootstrap archives FROM SOURCE (not prebuilt debs) for the
# custom Android app prefix /data/data/cc.agentlabs.agentpod/files/usr.
# The prefix is baked in at compile time via TERMUX_APP__PACKAGE_NAME in
# scripts/properties.sh, so all ELF RUNPATHs and script shebangs point at the
# agentpod prefix instead of com.termux.

on:
  workflow_dispatch:

permissions: {} # none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64
          - arm
          - i686
          - x86_64
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h /

      - name: Show target prefix
        run: |
          grep -n 'TERMUX_APP__PACKAGE_NAME=' scripts/properties.sh | head -n 2

      - name: Install extra Android SDK components (for termux-am APK)
        run: |
          # termux-am v0.8.0 builds its APK with AGP 7.4.2 against
          # platforms;android-33 + build-tools;30.0.3. The package-builder image
          # only pre-installs newer platforms/build-tools (android-35/28/24,
          # build-tools 37.0.0) which AGP 7.4.2 can't use, and AGP's on-the-fly
          # auto-download fails in CI with "Failed to read or create install
          # properties file" because the SDK dir isn't writable by the build
          # user. Fix: chown the SDK to the builder user, point sdkmanager at a
          # writable ANDROID_USER_HOME, install the exact versions, and hard-assert
          # they landed so any failure surfaces here (not later inside gradle).
          # Runs in the same persistent container that the build step reuses.
          ./scripts/run-docker.sh bash -c '
            set -eux
            SDK_ROOT="$(ls -d /home/builder/lib/android-sdk-* 2>/dev/null | head -n1)"
            : "${SDK_ROOT:?Android SDK not found in image}"
            # Ensure the build user can write the SDK dir (root of the install failure).
            sudo chown -R "$(id -u):$(id -g)" "$SDK_ROOT" || true
            export ANDROID_HOME="$SDK_ROOT" ANDROID_SDK_ROOT="$SDK_ROOT"
            export ANDROID_USER_HOME="$HOME/.android"
            mkdir -p "$ANDROID_USER_HOME"
            SDKMGR="$(ls "$SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager \
                          "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
            : "${SDKMGR:?sdkmanager not found}"
            echo "SDK_ROOT=$SDK_ROOT SDKMGR=$SDKMGR ANDROID_USER_HOME=$ANDROID_USER_HOME"
            yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" --sdk_root="$SDK_ROOT" "platforms;android-33" "build-tools;30.0.3"
            echo "=== installed platforms ==="; ls "$SDK_ROOT/platforms"
            echo "=== installed build-tools ==="; ls "$SDK_ROOT/build-tools"
            # Hard assertion: fail this step (with a clear message) if the exact
            # versions termux-am needs are still missing.
            test -d "$SDK_ROOT/platforms/android-33" \
              || { echo "ERROR: platforms;android-33 not installed" >&2; exit 1; }
            test -d "$SDK_ROOT/build-tools/30.0.3" \
              || { echo "ERROR: build-tools;30.0.3 not installed" >&2; exit 1; }
            echo "Android SDK components ready"
          '

      - name: Build bootstrap archive from source (${{ matrix.arch }})
        run: |
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh -f --architectures ${{ matrix.arch }}

      - name: Verify prefix baked into artifacts (${{ matrix.arch }})
        run: |
          set -euo pipefail
          zip="bootstrap-${{ matrix.arch }}.zip"
          test -f "$zip"
          rm -rf _verify && mkdir _verify
          unzip -q "$zip" -d _verify
          echo "=== readelf -d bin/bash RUNPATH ==="
          runpath="$(readelf -d _verify/bin/bash | grep -iE 'RUNPATH|RPATH' || true)"
          echo "$runpath"
          if echo "$runpath" | grep -q 'com.termux'; then
            echo "ERROR: RUNPATH still references com.termux" >&2
            exit 1
          fi
          if ! echo "$runpath" | grep -q '/data/data/cc.agentlabs.agentpod/files/usr/lib'; then
            echo "ERROR: RUNPATH does not reference agentpod prefix" >&2
            exit 1
          fi
          echo "=== shebang check (termux-bootstrap second stage) ==="
          sec="$(find _verify -name 'termux-bootstrap-second-stage.sh' | head -n1)"
          if [ -n "$sec" ]; then
            head -n 1 "$sec"
            head -n 1 "$sec" | grep -q '/data/data/cc.agentlabs.agentpod/files/usr' || {
              echo "ERROR: second-stage shebang/prefix wrong" >&2; exit 1; }
          fi
          echo "=== sample ELF interpreter/shebang scan for com.termux ==="
          if grep -rIl 'com.termux' _verify/bin 2>/dev/null | head; then
            echo "WARNING: found com.termux string references in bin scripts (review above)"
          fi
          rm -rf _verify

      - name: Store bootstrap artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.arch }}
          path: bootstrap-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7
